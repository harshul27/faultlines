name: checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Capability tests
        run: python tests/check.py
      - name: Realism vs held-out real data
        run: python calibration/validate.py
      - name: Web data, live stream and API
        run: python tests/check_web.py
