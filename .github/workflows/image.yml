name: image
on:
  push:
    branches: [main]
    paths: ["*.py", "calib/**", "web/**", "targets.json", "requirements-server.txt", "Dockerfile"]
  workflow_dispatch:
permissions:
  contents: read
concurrency: image
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REGISTRY: faultlinesacr02881.azurecr.io
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/faultlines:${{ github.sha }}
            ${{ env.REGISTRY }}/faultlines:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
